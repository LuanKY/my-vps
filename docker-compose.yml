services:
  app:
    build: .
    container_name: my-vps
    restart: unless-stopped
    ports:
      - "8000:8000"
    networks:
      - default
      - proxy
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - /var/run/utmp:/var/run/utmp:ro
      - /proc/net/dev:/host/proc/net/dev:ro
networks:
    proxy:
      external: true
