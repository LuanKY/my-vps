name: Deploy MyVPS

on:
  push:
    branches:
      - main

concurrency:
  group: deploy-my-vps
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Deploy to VPS
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SSH_PORT || 22 }}
          script: |
            bash -c "cd /opt/my-vps && git fetch origin main && git checkout origin/main -- deploy.sh && bash /opt/my-vps/deploy.sh"
