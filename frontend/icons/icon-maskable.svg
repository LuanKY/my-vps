<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Background Gradient for full canvas -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#11151c"/>
      <stop offset="100%" stop-color="#080a0d"/>
    </linearGradient>

    <!-- Server Blade Gradient -->
    <linearGradient id="bladeGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1d232d"/>
      <stop offset="100%" stop-color="#141820"/>
    </linearGradient>

    <linearGradient id="bladeActiveGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#162e26"/>
      <stop offset="100%" stop-color="#141820"/>
    </linearGradient>

    <!-- Emerald / Teal Pulse Gradient -->
    <linearGradient id="pulseGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="50%" stop-color="#34d399"/>
      <stop offset="100%" stop-color="#06b6d4"/>
    </linearGradient>

    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="7" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <filter id="subtleGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- 100% Solid Full Square Background for Maskable Icon -->
  <rect width="512" height="512" fill="url(#bgGrad)"/>

  <!-- Scaled down to safe zone (80% safe zone centered) -->
  <g transform="translate(51.2, 51.2) scale(0.8)">
    <!-- Inner Server Rack Chassis Frame -->
    <rect x="76" y="80" width="360" height="352" rx="24" fill="#0c0e13" stroke="#1f2733" stroke-width="4"/>

    <!-- BLADE 1 -->
    <g transform="translate(96, 102)">
      <rect width="320" height="88" rx="12" fill="url(#bladeActiveGrad)" stroke="#1e2c28" stroke-width="2.5"/>
      <rect x="18" y="24" width="48" height="40" rx="6" fill="#0d1117" stroke="#222b38" stroke-width="1.5"/>
      <rect x="74" y="24" width="48" height="40" rx="6" fill="#0d1117" stroke="#222b38" stroke-width="1.5"/>
      <rect x="130" y="24" width="48" height="40" rx="6" fill="#0d1117" stroke="#222b38" stroke-width="1.5"/>
      <circle cx="210" cy="44" r="5" fill="#34d399" filter="url(#subtleGlow)"/>
      <circle cx="228" cy="44" r="5" fill="#10b981"/>
      <circle cx="246" cy="44" r="5" fill="#06b6d4" filter="url(#subtleGlow)"/>
      <path d="M 268 48 L 278 40 L 288 46 L 302 34" fill="none" stroke="#34d399" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    </g>

    <!-- BLADE 2 -->
    <g transform="translate(96, 212)">
      <rect width="320" height="88" rx="12" fill="url(#bladeGrad)" stroke="#222a36" stroke-width="2.5"/>
      <rect x="18" y="24" width="48" height="40" rx="6" fill="#0d1117" stroke="#222b38" stroke-width="1.5"/>
      <rect x="74" y="24" width="48" height="40" rx="6" fill="#0d1117" stroke="#222b38" stroke-width="1.5"/>
      <circle cx="148" cy="44" r="5" fill="#34d399" filter="url(#subtleGlow)"/>
      <circle cx="166" cy="44" r="5" fill="#10b981"/>
      <line x1="280" y1="30" x2="280" y2="58" stroke="#1c232e" stroke-width="3" stroke-linecap="round"/>
      <line x1="290" y1="30" x2="290" y2="58" stroke="#1c232e" stroke-width="3" stroke-linecap="round"/>
      <line x1="300" y1="30" x2="300" y2="58" stroke="#1c232e" stroke-width="3" stroke-linecap="round"/>
    </g>

    <!-- BLADE 3 -->
    <g transform="translate(96, 322)">
      <rect width="320" height="88" rx="12" fill="url(#bladeGrad)" stroke="#222a36" stroke-width="2.5"/>
      <rect x="18" y="24" width="48" height="40" rx="6" fill="#0d1117" stroke="#222b38" stroke-width="1.5"/>
      <rect x="74" y="24" width="48" height="40" rx="6" fill="#0d1117" stroke="#222b38" stroke-width="1.5"/>
      <rect x="130" y="24" width="48" height="40" rx="6" fill="#0d1117" stroke="#222b38" stroke-width="1.5"/>
      <circle cx="210" cy="44" r="5" fill="#34d399"/>
      <circle cx="228" cy="44" r="5" fill="#06b6d4" filter="url(#subtleGlow)"/>
      <circle cx="246" cy="44" r="5" fill="#10b981"/>
      <line x1="280" y1="30" x2="280" y2="58" stroke="#1c232e" stroke-width="3" stroke-linecap="round"/>
      <line x1="290" y1="30" x2="290" y2="58" stroke="#1c232e" stroke-width="3" stroke-linecap="round"/>
      <line x1="300" y1="30" x2="300" y2="58" stroke="#1c232e" stroke-width="3" stroke-linecap="round"/>
    </g>

    <!-- PULSE WAVE -->
    <path d="M 120 256 L 195 256 L 215 224 L 235 292 L 255 236 L 270 274 L 285 256 L 392 256"
          fill="none" stroke="url(#pulseGrad)" stroke-width="9" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)"/>
    <path d="M 120 256 L 195 256 L 215 224 L 235 292 L 255 236 L 270 274 L 285 256 L 392 256"
          fill="none" stroke="#f0fdf4" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>

    <circle cx="235" cy="292" r="6" fill="#34d399" filter="url(#glow)"/>
    <circle cx="235" cy="292" r="3.5" fill="#ffffff"/>
    <circle cx="255" cy="236" r="6" fill="#06b6d4" filter="url(#glow)"/>
    <circle cx="255" cy="236" r="3.5" fill="#ffffff"/>
  </g>
</svg>